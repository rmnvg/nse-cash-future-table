services:
  postgres:
    image: postgres:16-alpine
    container_name: cashfuture_postgres
    environment:
      POSTGRES_USER: cashfuture
      POSTGRES_PASSWORD: cashfuture
      POSTGRES_DB: cashfuture
    ports:
      - "5432:5432"
    volumes:
      - cashfuture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashfuture -d cashfuture"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cashfuture_pgdata:
